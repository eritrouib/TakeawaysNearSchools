# Rebuilds the takeaway files from the Food Standards Agency's open data every
# Tuesday, and on demand: GitHub -> Actions -> "Update takeaways" -> Run workflow.
name: Update takeaways

on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build takeaway files
        run: python scripts/build_takeaways.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update takeaway data"
          git push
